name: CodeMentor Pro CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Run Ruff
        run: python -m ruff check backend frontend alembic

  test:
    name: Pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: codementor
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: codementor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codementor -d codementor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://codementor:ci_test_password@127.0.0.1:5432/codementor_test
      TEST_DATABASE_URL: postgresql+psycopg://codementor:ci_test_password@127.0.0.1:5432/codementor_test

      JWT_SECRET_KEY: ci_only_jwt_secret_key_not_for_production_123456789
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"

      GEMINI_API_KEY: ci_dummy_key
      GOOGLE_API_KEY: ci_dummy_key
      API_BASE_URL: http://localhost:8000
      STREAMLIT_APP_URL: http://localhost:8501
      BROWSER_ALLOWED_ORIGINS: http://localhost:8000,http://localhost:8501
      COOKIE_SECURE: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Run frontend tests
        run: python -m pytest frontend/tests -q

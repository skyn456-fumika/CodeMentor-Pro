
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: codementor
      POSTGRES_USER: codementor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codementor -d codementor"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://codementor:${POSTGRES_PASSWORD}@db:5432/codementor
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      STREAMLIT_APP_URL: ${PUBLIC_URL:?PUBLIC_URL is required}
      BROWSER_ALLOWED_ORIGINS: ${PUBLIC_URL}
      COOKIE_SECURE: "true"
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        python -m alembic upgrade head &&
        python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend:8000
      PUBLIC_API_BASE_URL: ${PUBLIC_URL}
      STREAMLIT_APP_URL: ${PUBLIC_URL}
    depends_on:
      - backend
    command:
      - python
      - -m
      - streamlit
      - run
      - frontend/app.py
      - --server.address=0.0.0.0
      - --server.port=8501

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
